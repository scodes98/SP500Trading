syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.trading.proto";
option java_outer_classname = "PortfolioProto";

package portfolio;

message PositionRequest {
  string user_id = 1;
}

message Position {
  string symbol = 1;
  int32 BOUGHT = 2;
  int32 SOLD = 3;
}

message PositionResponse {
  repeated Position positions = 1;
}

service PortfolioService {
  rpc GetPositions (PositionRequest) returns (PositionResponse);
}
