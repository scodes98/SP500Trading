server:
  port: ${SERVER_PORT:9090}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:34.10.13.109}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

grpc:
  server:
    port: ${GRPC_PORT:9090}

  client:
    matching-engine:
      address: ${MATCHING_ENGINE_ADDRESS:dns:///matching-engine-1011460061885.us-central1.run.app:443}
      negotiationType: ${MATCHING_ENGINE_NEGOTIATION_TYPE:TLS}
