server:
  port: 
  
spring:
  datasource:
    url: jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

grpc:
  server:
    port: 9090

  client:
    matching-engine:
      address: static://localhost:9091
      negotiationType: plaintext

